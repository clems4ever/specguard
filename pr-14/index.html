    <script>window.__SPECGUARD_REPORT__={"specs":[{"id":"diff-impl-changed","title":"A spec whose covered code changed is flagged","path":"specs/diff/impl-changed.md","body":"## Behaviour\n\nWhen a change touches a file a spec `covers:`, that spec is marked impl-changed even if its definition and coverage are untouched.\n\n## Why\n\nThe behaviour's implementation moved under it — worth a reviewer's eyes even though traceability is intact.\n","tests":["internal/diff/diff_test.go"],"refs":[{"file":"internal/diff/diff_test.go","line":89,"test":"TestImplChangedWhenCoveredCodeTouched","status":"passed"}],"covers":["internal/diff"],"covered":true,"coversOk":true,"draft":false,"parent":"diff-review","fingerprint":"f13eba1281962f55","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"diff-regression","title":"The delta flags coverage regressions","path":"specs/diff/regression.md","body":"## Behaviour\n\nDiffed against a base ref, a spec that arrives uncovered (or loses its coverage) is reported as a regression.\n\n## Why\n\nA reviewer should be able to trust one number — regressions — instead of re-reading the whole spec set on every change.\n","tests":["internal/diff/git_test.go"],"refs":[{"file":"internal/diff/git_test.go","line":41,"test":"TestDiffAgainstGitBase","status":"passed"}],"covers":["internal/diff"],"covered":true,"coversOk":true,"draft":false,"parent":"diff-review","fingerprint":"53b3498564b70042","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"diff-review","title":"A change can be reviewed in isolation","path":"specs/diff/review.md","body":"## Behaviour\n\nGiven a base git ref, specguard reports only the specs a change touched — what\ngained or lost coverage, and which covered code changed — so review focuses on\nthe delta rather than the whole catalog. The specs below are the parts of that.\n\n## Why\n\nRe-reading every spec after each change does not scale; showing just what moved\nis what makes the check usable on real pull requests.\n","tests":null,"covers":["internal/diff"],"covered":false,"coversOk":true,"draft":false,"hasChild":true,"fingerprint":"2abef57b614b8d32","lifecycle":"proposed"},{"id":"lint-covered-passes","title":"A spec referenced by a test is covered","path":"specs/lint/covered-passes.md","body":"## Behaviour\n\nWhen at least one test carries a `spec:\u003cid\u003e` reference for a spec, that spec is marked covered and the run passes.\n\n## Why\n\nCoverage is the core signal: a documented behaviour is only trustworthy once a test is pinned to it.\n","tests":["internal/lint/lint_test.go"],"refs":[{"file":"internal/lint/lint_test.go","line":53,"test":"TestCoveredSpecPasses","status":"passed"}],"covers":["internal/lint"],"covered":true,"coversOk":true,"draft":false,"parent":"lint-traceability","fingerprint":"c7308678c5d013ef","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"lint-covers-unmatched","title":"A covers entry matching no file warns","path":"specs/lint/covers-unmatched.md","body":"## Behaviour\n\nA `covers:` glob that matches no file in the tree is a warning (promoted to an error under `-strict`).\n\n## Why\n\nA covers entry pointing at code that no longer exists is stale traceability worth surfacing.\n","tests":["internal/lint/lint_test.go"],"refs":[{"file":"internal/lint/lint_test.go","line":161,"test":"TestCoversUnmatchedWarns","status":"passed"}],"covers":["internal/lint"],"covered":true,"coversOk":true,"draft":false,"parent":"lint-traceability","fingerprint":"63e2a2f0c1e6c2ad","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"lint-draft-uncovered-warns","title":"A draft spec may be uncovered","path":"specs/lint/draft-uncovered-warns.md","body":"## Behaviour\n\nA spec with `status: draft` that has no covering test yet is a warning, not a failure.\n\n## Why\n\nDrafts capture planned behaviour before the test exists; they should be visible without blocking the build.\n","tests":["internal/lint/lint_test.go"],"refs":[{"file":"internal/lint/lint_test.go","line":82,"test":"TestUncoveredDraftWarnsNotFails","status":"passed"}],"covers":["internal/lint"],"covered":true,"coversOk":true,"draft":false,"parent":"lint-traceability","fingerprint":"f7e3968ff6cf1a76","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"lint-duplicate-id","title":"Duplicate spec ids are rejected","path":"specs/lint/duplicate-id.md","body":"## Behaviour\n\nTwo spec files sharing the same `id` produce a `duplicate-id` error.\n\n## Why\n\nIds are the join key between specs and tests; a collision makes coverage ambiguous.\n","tests":["internal/lint/lint_test.go"],"refs":[{"file":"internal/lint/lint_test.go","line":149,"test":"TestDuplicateIDFails","status":"passed"}],"covers":["internal/lint"],"covered":true,"coversOk":true,"draft":false,"parent":"lint-traceability","fingerprint":"fd88619dfd1c3470","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"lint-ref-locations","title":"Each reference records its file and line","path":"specs/lint/ref-locations.md","body":"## Behaviour\n\nEvery `spec:\u003cid\u003e` reference is recorded with its file and 1-based line, and a Go reference also carries the test function it sits above.\n\n## Why\n\nPrecise locations are what let the report deep-link to the exact covering test and correlate `go test` results back to a spec.\n","tests":["internal/lint/lint_test.go"],"refs":[{"file":"internal/lint/lint_test.go","line":204,"test":"TestRefsCaptureFileAndLine","status":"passed"}],"covers":["internal/lint"],"covered":true,"coversOk":true,"draft":false,"parent":"lint-traceability","fingerprint":"ce823d36d9fbc812","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"lint-spec-body-not-coverage","title":"A token in a spec body is not coverage","path":"specs/lint/spec-body-not-coverage.md","body":"## Behaviour\n\nA `spec:\u003cid\u003e` token appearing inside a spec's own markdown body does not count as a covering reference.\n\n## Why\n\nProse about a spec shouldn't be mistaken for a test that enforces it, or every spec could trivially 'cover' itself.\n","tests":["internal/lint/lint_test.go"],"refs":[{"file":"internal/lint/lint_test.go","line":193,"test":"TestSpecFilesNotScannedAsTests","status":"passed"}],"covers":["internal/lint"],"covered":true,"coversOk":true,"draft":false,"parent":"lint-traceability","fingerprint":"19a367932390f3fa","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"lint-strict-promotes","title":"Strict mode promotes warnings to errors","path":"specs/lint/strict-promotes.md","body":"## Behaviour\n\nUnder `-strict`, warnings such as `covers-unmatched` become errors and fail the run.\n\n## Why\n\nSome projects want zero tolerance; strict mode lets the same rules gate a build hard.\n","tests":["internal/lint/lint_test.go"],"refs":[{"file":"internal/lint/lint_test.go","line":176,"test":"TestStrictPromotesWarning","status":"passed"}],"covers":["internal/lint"],"covered":true,"coversOk":true,"draft":false,"parent":"lint-traceability","fingerprint":"05a0cb315d6831bd","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"lint-traceability","title":"Traceability is enforced","path":"specs/lint/traceability.md","body":"## Behaviour\n\nEvery spec must be proven by a real test and every reference must resolve to a\ndefined spec, or the build fails. The specs below are the individual rules that\nenforce this.\n\n## Why\n\nTraceability is the product's core promise: if it isn't mechanically enforced,\nspecs and code drift apart and the catalog stops being trustworthy.\n","tests":null,"covers":["internal/lint"],"covered":false,"coversOk":true,"draft":false,"hasChild":true,"fingerprint":"9516826976eb1cae","lifecycle":"proposed"},{"id":"lint-uncovered-is-error","title":"An uncovered spec fails the build","path":"specs/lint/uncovered-is-error.md","body":"## Behaviour\n\nA non-draft spec that no test references is reported as an `uncovered-spec` error, and the run exits non-zero.\n\n## Why\n\nAn uncovered spec is a promise with nothing holding it true; the build should refuse to go green on it.\n","tests":["internal/lint/lint_test.go"],"refs":[{"file":"internal/lint/lint_test.go","line":68,"test":"TestUncoveredSpecFails","status":"passed"}],"covers":["internal/lint"],"covered":true,"coversOk":true,"draft":false,"parent":"lint-traceability","fingerprint":"c02cf3a3287295db","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"lint-undefined-reference","title":"A reference to an unknown spec is an error","path":"specs/lint/undefined-reference.md","body":"## Behaviour\n\nA `spec:\u003cid\u003e` reference in a test that resolves to no defined spec is an `undefined-reference` error.\n\n## Why\n\nA dangling reference means a test claims to cover a behaviour that isn't documented — usually a typo or a deleted spec.\n","tests":["internal/lint/lint_test.go"],"refs":[{"file":"internal/lint/lint_test.go","line":133,"test":"TestUndefinedReferenceFails","status":"passed"}],"covers":["internal/lint"],"covered":true,"coversOk":true,"draft":false,"parent":"lint-traceability","fingerprint":"efa6513af6c950a2","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"report-artifacts-copied","title":"Screenshots are published beside the report","path":"specs/report/artifacts-copied.md","body":"## Behaviour\n\nWith `-assets`, each spec's screenshots are copied under `assets/specs/\u003cid\u003e/` and referenced by relative URL; a missing source is skipped, not fatal.\n\n## Why\n\nTurning the single file into a bundle is how galleries reach GitHub Pages without inlining megabytes of images.\n","tests":["internal/report/artifacts_test.go"],"refs":[{"file":"internal/report/artifacts_test.go","line":11,"test":"TestWriteArtifactsCopiesAndRewritesPaths","status":"passed"}],"covers":["internal/report"],"covered":true,"coversOk":true,"draft":false,"parent":"report-catalog","fingerprint":"d0f25a0f98a1dbbc","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"report-branch-slug","title":"Branch names slug without collisions","path":"specs/report/branch-slug.md","body":"## Behaviour\n\nA branch name is encoded to a filesystem-safe directory segment reversibly, so distinct branches never map to the same per-branch report.\n\n## Why\n\nPer-branch publishing must never silently overwrite one branch's report with another's.\n","tests":["internal/report/slug_test.go"],"refs":[{"file":"internal/report/slug_test.go","line":25,"test":"TestSlugBranchNoCollision","status":"passed"}],"covers":["internal/report"],"covered":true,"coversOk":true,"draft":false,"parent":"report-catalog","fingerprint":"fc8a206596abbab0","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"report-catalog","title":"A self-contained report is produced","path":"specs/report/catalog.md","body":"## Behaviour\n\n`specguard report` turns a run into a single, shareable HTML catalog: the specs,\ntheir data embedded so it works offline, screenshots published beside it, and\nbranch-safe slugs. The specs below are the guarantees that make that report\ncorrect and safe.\n\n## Why\n\nA report is only trustworthy if it is complete, self-contained, and can't be\ncorrupted by the very data it renders.\n","tests":null,"covers":["internal/report"],"covered":false,"coversOk":true,"draft":false,"hasChild":true,"fingerprint":"b3e3b94bd8eb06c5","lifecycle":"proposed"},{"id":"report-embeds-data","title":"The report embeds its data","path":"specs/report/embeds-data.md","body":"## Behaviour\n\n`specguard report` splices the lint report into the UI template as JSON on `window`, so the page renders offline with no server.\n\n## Why\n\nA self-contained file can be committed, emailed, or published to Pages and still work — that's the whole point of the report.\n","tests":["internal/report/report_test.go"],"refs":[{"file":"internal/report/report_test.go","line":48,"test":"TestRenderEmbedsRoundTrippableReport","status":"passed"}],"covers":["internal/report"],"covered":true,"coversOk":true,"draft":false,"parent":"report-catalog","fingerprint":"5c81f9d3b7dc3339","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"report-escapes-breakout","title":"Embedded data can't break out of the script","path":"specs/report/escapes-breakout.md","body":"## Behaviour\n\nThe embedded JSON is escaped so a spec body containing `\u003c/script\u003e` or an HTML comment cannot break out of the `\u003cscript\u003e` tag.\n\n## Why\n\nThe report renders untrusted spec text; an injection that breaks the page (or worse) would undermine the trust artifact.\n","tests":["internal/report/report_test.go"],"refs":[{"file":"internal/report/report_test.go","line":106,"test":"TestRenderEscapesHTMLBreakout","status":"passed"}],"covers":["internal/report"],"covered":true,"coversOk":true,"draft":false,"parent":"report-catalog","fingerprint":"236beac0871624a0","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"results-format-autodetect","title":"Result formats are auto-detected","path":"specs/results/format-autodetect.md","body":"## Behaviour\n\nEach results file is classified as Playwright JSON or `go test -json` by its shape, so a mixed set can be passed together.\n\n## Why\n\nOne flag that 'just works' across runners is friendlier than making the user declare each file's format.\n","tests":["internal/results/results_test.go"],"refs":[{"file":"internal/results/results_test.go","line":143,"test":"TestFormatAutoDetection","status":"passed"}],"covers":["internal/results"],"covered":true,"coversOk":true,"draft":false,"parent":"results-overlay","fingerprint":"ba5c52d5c927661b","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"results-go-func","title":"Go results map by test function","path":"specs/results/go-func.md","body":"## Behaviour\n\nA `go test -json` stream maps each test's outcome to a spec via the test function the `// spec:\u003cid\u003e` comment sits above.\n\n## Why\n\nGo's machine output is keyed by function name, so the comment-to-function association is what closes the loop to a spec.\n","tests":["internal/results/results_test.go"],"refs":[{"file":"internal/results/results_test.go","line":72,"test":"TestGoTestParsing","status":"passed"}],"covers":["internal/results"],"covered":true,"coversOk":true,"draft":false,"parent":"results-overlay","fingerprint":"0fdc00741efbdcc6","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"results-overlay","title":"A real test run overlays onto the specs","path":"specs/results/overlay.md","body":"## Behaviour\n\nGiven the output of a test run, specguard maps each result back to the spec it\nproves, so a spec reads pass or fail. The specs below are the parts of that\nmapping.\n\n## Why\n\nCoverage says a test *exists*; overlaying its result says the behaviour is\nactually *proven right now* — the difference a PM cares about.\n","tests":null,"covers":["internal/results"],"covered":false,"coversOk":true,"draft":false,"hasChild":true,"fingerprint":"432637e7ba57c8e9","lifecycle":"proposed"},{"id":"results-playwright-tag","title":"Playwright results map by tag","path":"specs/results/playwright-tag.md","body":"## Behaviour\n\nA Playwright JSON report maps each test's outcome to a spec via its `@spec:\u003cid\u003e` tag.\n\n## Why\n\nThe tag is already the coverage link; reusing it means test outcomes attach to specs with no extra wiring.\n","tests":["internal/results/results_test.go"],"refs":[{"file":"internal/results/results_test.go","line":54,"test":"TestPlaywrightParsing","status":"passed"}],"covers":["internal/results"],"covered":true,"coversOk":true,"draft":false,"parent":"results-overlay","fingerprint":"2c7dee4edc0cce39","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"results-screenshots","title":"Screenshots attach to their spec","path":"specs/results/screenshots.md","body":"## Behaviour\n\nImage attachments on a `@spec:\u003cid\u003e`-tagged Playwright test are collected as that spec's artifacts; non-image attachments are ignored.\n\n## Why\n\nA screenshot is visual proof of a behaviour — attaching it to the spec turns the report into something a PM can look at.\n","tests":["internal/results/results_test.go"],"refs":[{"file":"internal/results/results_test.go","line":105,"test":"TestPlaywrightImageAttachments","status":"passed"}],"covers":["internal/results"],"covered":true,"coversOk":true,"draft":false,"parent":"results-overlay","fingerprint":"2bfe77b271a21e2e","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"results-worst-wins","title":"A spec fails if any covering test fails","path":"specs/results/worst-wins.md","body":"## Behaviour\n\nA spec's aggregate result is worst-wins: it is failing if any of its covering tests failed, passing only when all ran and none failed.\n\n## Why\n\n'Covered but failing' is the most important state to surface; one red test must not be hidden behind a green sibling.\n","tests":["internal/results/results_test.go"],"refs":[{"file":"internal/results/results_test.go","line":153,"test":"TestApplyCorrelatesAndAggregates","status":"passed"}],"covers":["internal/results"],"covered":true,"coversOk":true,"draft":false,"parent":"results-overlay","fingerprint":"258595c56badea6b","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"server-badge","title":"The server serves a coverage badge","path":"specs/server/badge.md","body":"## Behaviour\n\nThe server exposes a shields-style SVG badge summarising the spec count and pass/coverage state.\n\n## Why\n\nA README badge makes the traceability status visible at a glance without opening the report.\n","tests":["internal/server/server_test.go"],"refs":[{"file":"internal/server/server_test.go","line":186,"test":"TestBadgeSVG","status":"passed"}],"covers":["internal/server"],"covered":true,"coversOk":true,"draft":false,"parent":"server-live","fingerprint":"6c97ae6bd8c1b90f","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"server-live","title":"The report can be served live","path":"specs/server/live.md","body":"## Behaviour\n\n`specguard serve` exposes the report over HTTP while you work: the live report,\na coverage badge, and a single-page-app fallback so deep links resolve on a hard\nrefresh. The specs below are those endpoints and behaviours.\n\n## Why\n\nA live server turns the report from a snapshot into a dashboard you can keep\nopen and refresh as the repo changes.\n","tests":null,"covers":["internal/server"],"covered":false,"coversOk":true,"draft":false,"hasChild":true,"fingerprint":"3a8df5b9387e60f2","lifecycle":"proposed"},{"id":"server-live-report","title":"The server returns a live report","path":"specs/server/live-report.md","body":"## Behaviour\n\n`specguard serve` recomputes and returns the report as JSON on every request, so edits on disk show up on refresh.\n\n## Why\n\nThe live UI is only useful if it reflects the working tree as it is now, not a stale snapshot.\n","tests":["internal/server/server_test.go"],"refs":[{"file":"internal/server/server_test.go","line":43,"test":"TestReportEndpointReturnsLiveJSON","status":"passed"}],"covers":["internal/server"],"covered":true,"coversOk":true,"draft":false,"parent":"server-live","fingerprint":"f8d0bc2e3ac2b8e8","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"server-spa-fallback","title":"Unknown routes fall back to the app","path":"specs/server/spa-fallback.md","body":"## Behaviour\n\nA request for an unknown path serves the built `index.html`, so a hard refresh on a client-side route (e.g. `/spec/\u003cid\u003e`) still loads the app.\n\n## Why\n\nDeep links into a spec must survive a refresh for the report to be shareable.\n","tests":["internal/server/server_test.go"],"refs":[{"file":"internal/server/server_test.go","line":135,"test":"TestStaticSPAFallback","status":"passed"}],"covers":["internal/server"],"covered":true,"coversOk":true,"draft":false,"parent":"server-live","fingerprint":"4a1fa07e86965d30","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"spec-acceptance","title":"A behaviour is accepted once, then guarded","path":"specs/spec/acceptance.md","body":"## Behaviour\n\nEach spec has a *fingerprint* of its expectation — its intent plus the source of\nits covering tests. A PM records acceptance against that fingerprint once. While\nthe fingerprint is unchanged the acceptance holds and the covering tests guard\nnon-regression automatically; a pure code refactor never disturbs it. Changing\nthe intent or a covering test changes the fingerprint, so that one spec becomes\n`stale` and routes back for re-review. `specguard accept --check` fails while any\nimplemented spec is unaccepted at its current fingerprint.\n\n## Why\n\nThe PM's judgement is expensive and must not be re-spent on every change. Binding\na one-time behavioural sign-off to a fingerprint — and letting the tests carry it\nforward — is what makes review scale as agents do most of the work.\n","tests":["internal/lint/acceptance_test.go"],"refs":[{"file":"internal/lint/acceptance_test.go","line":18,"test":"TestFingerprintStableAndBehaviourSensitive","status":"passed"},{"file":"internal/lint/acceptance_test.go","line":39,"test":"TestLifecycleAcceptThenStaleOnBehaviourChange","status":"passed"}],"covers":["internal/lint/acceptance.go"],"covered":true,"coversOk":true,"draft":false,"fingerprint":"741601f38600bbca","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"},{"id":"spec-frontmatter","title":"A spec is parsed from frontmatter","path":"specs/spec/frontmatter.md","body":"## Behaviour\n\nA spec file is `id`, `title`, optional `status` and `covers` in a leading `---` block, followed by a free-form markdown body. All of it is parsed and the body is carried through verbatim.\n\n## Why\n\nThe spec file is the human-readable half of the contract; the report and the linter both rely on this shape being parsed faithfully.\n","tests":["internal/spec/spec_test.go"],"refs":[{"file":"internal/spec/spec_test.go","line":5,"test":"TestParseValid","status":"passed"}],"covers":["internal/spec"],"covered":true,"coversOk":true,"draft":false,"parent":"spec-model","fingerprint":"75762b9e81838f89","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T16:09:11Z","result":"passed"},{"id":"spec-frontmatter-invalid","title":"Malformed frontmatter is rejected","path":"specs/spec/frontmatter-invalid.md","body":"## Behaviour\n\nA spec missing its `id` (or with a malformed id, bad status, or an unterminated frontmatter block) is a parse error rather than a silently-empty spec.\n\n## Why\n\nA spec that can't be identified can't be traced to a test — failing loudly beats a spec that quietly covers nothing.\n","tests":["internal/spec/spec_test.go"],"refs":[{"file":"internal/spec/spec_test.go","line":45,"test":"TestParseMissingID","status":"passed"}],"covers":["internal/spec"],"covered":true,"coversOk":true,"draft":false,"parent":"spec-model","fingerprint":"bb79e28dca708c9f","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T16:09:11Z","result":"passed"},{"id":"spec-hierarchy","title":"Specs derive from one another","path":"specs/spec/hierarchy.md","body":"## Behaviour\n\nA spec may declare a `parent`, forming a tree from broad intents down to leaf\nbehaviours. A leaf must be covered by a real test; a parent's coverage is\n*derived* — it needs no test of its own and is satisfied when all its children\nare. An undefined parent or a cycle in the parent chain fails the build.\n\n## Why\n\nA flat list captures leaf assertions but not intent. Deriving specs lets a\nhigh-level capability be the thing a human or agent reasons about, with the\nconcrete tests as its proof — and makes it clear why a low-level behaviour\nexists and what breaks if it changes.\n","tests":["internal/lint/lint_test.go","web/e2e/overview.spec.ts"],"refs":[{"file":"internal/lint/lint_test.go","line":259,"test":"TestParentCoveredByChildrenNeedsNoOwnTest","status":"passed"},{"file":"internal/lint/lint_test.go","line":283,"test":"TestParentWithUncoveredLeafStillFailsAtTheLeaf","status":"passed"},{"file":"internal/lint/lint_test.go","line":325,"test":"TestParentMayAlsoCarryItsOwnTest","status":"passed"},{"file":"web/e2e/overview.spec.ts","line":10,"status":"passed"}],"covers":["internal/spec/spec.go","internal/lint/lint.go"],"covered":true,"coversOk":true,"draft":false,"parent":"spec-model","fingerprint":"336366de4c6b11f7","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed","artifacts":[{"name":"hierarchy","path":"assets/specs/spec-hierarchy/0.png"}]},{"id":"spec-model","title":"A spec is a parsed markdown file","path":"specs/spec/model.md","body":"## Behaviour\n\nA spec is plain markdown with frontmatter declaring a stable id, a title, the\ncode it governs and (optionally) a parent. specguard parses it, rejects\nmalformed frontmatter, and derives specs from one another. The specs below are\nthe parts of that model.\n\n## Why\n\nThe whole tool rests on a simple, dependency-free file format a human can write\nand an agent can read — so the format's rules must themselves be specified.\n","tests":null,"covers":["internal/spec"],"covered":false,"coversOk":true,"draft":false,"hasChild":true,"fingerprint":"fbddf47e2eb0f4a5","lifecycle":"proposed"},{"id":"ui-area-overview","title":"Each area can describe itself","path":"specs/ui/area-overview.md","body":"## Behaviour\n\nAn area of specs can carry a human overview — a title and a one-line\ndescription — written in an optional `specs/\u003carea\u003e/_area.md` file. When present,\nthe report shows it beneath the area heading, so a reader learns what a group of\nspecs is about without opening any of them. The overview file is not a spec and\nnever affects the build.\n\n## Why\n\nGrouping specs by area only helps if the reader knows what each area is for. A\nbare directory name (`lint`, `results`) is opaque; a sentence of context turns\nthe grouping into a table of contents a newcomer can follow.\n","tests":["internal/lint/lint_test.go","internal/spec/spec_test.go","web/e2e/overview.spec.ts"],"refs":[{"file":"internal/lint/lint_test.go","line":236,"test":"TestAreaOverviewLoadedAndNotASpec","status":"passed"},{"file":"internal/spec/spec_test.go","line":83,"test":"TestParseAreaFrontmatterAndBody","status":"passed"},{"file":"web/e2e/overview.spec.ts","line":65,"status":"passed"}],"covers":["internal/spec/spec.go","web/src/components/Dashboard.tsx"],"covered":true,"coversOk":true,"draft":false,"parent":"ui-report","preview":"/","fingerprint":"b7eb405a0a81fac8","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T16:09:11Z","result":"passed"},{"id":"ui-code-links","title":"Specs and tests deep-link to the code","path":"specs/ui/code-links.md","body":"## Behaviour\n\nIn a spec detail, the spec's source and each covering test are links to the code\non GitHub at the exact commit the report was generated from, down to the line.\n\n## Why\n\nTraceability is only useful if it's one click from a behaviour to the code that\nimplements and proves it.\n","tests":["web/e2e/report.spec.ts"],"refs":[{"file":"web/e2e/report.spec.ts","line":51,"status":"passed"}],"covers":["web/src"],"covered":true,"coversOk":true,"draft":false,"parent":"ui-report","preview":"/spec/ui-code-links","fingerprint":"d35749e832224db0","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed","artifacts":[{"name":"deep links to code","path":"assets/specs/ui-code-links/0.png"}]},{"id":"ui-dashboard","title":"The report renders a dashboard","path":"specs/ui/dashboard.md","body":"## Behaviour\n\nThe report opens on a dashboard: a PASS/FAIL banner, coverage and pass/fail\nstats, and every spec grouped by area — the at-a-glance view of the whole\ncatalog.\n\n## Why\n\nA traceability report is only a trust artifact if its overall state is legible\nin one glance, before anyone drills into a single spec.\n","tests":["web/e2e/overview.spec.ts"],"refs":[{"file":"web/e2e/overview.spec.ts","line":73,"status":"passed"}],"covers":["web/src"],"covered":true,"coversOk":true,"draft":false,"parent":"ui-report","preview":"/","fingerprint":"48973c1c02d639d5","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed","artifacts":[{"name":"dashboard","path":"assets/specs/ui-dashboard/0.png"}]},{"id":"ui-live-preview","title":"A spec deep-links to the live feature","path":"specs/ui/live-preview.md","body":"## Behaviour\n\nA spec can declare a `preview` path where its behaviour runs. When the report is\ngenerated with a preview base (a per-PR deploy), each such spec shows a \"Try it\nlive\" link that opens the running feature at that path — so a PM jumps straight\nfrom the spec to the behaviour to review it, without touching code.\n\n## Why\n\nA PM reviews by *using* the feature, not by reading a diff. Binding a spec to the\nexact screen in a live preview is what makes that review one click.\n","tests":["web/e2e/report-preview.spec.ts"],"refs":[{"file":"web/e2e/report-preview.spec.ts","line":29,"status":"passed"}],"covers":["web/src/links.ts","web/src/components/SpecDetail.tsx"],"covered":true,"coversOk":true,"draft":false,"parent":"ui-report","fingerprint":"6e2f72e82b824cdb","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T16:08:38Z","result":"passed"},{"id":"ui-orientation","title":"The report orients a first-time reader","path":"specs/ui/orientation.md","body":"## Behaviour\n\nThe dashboard opens with a short explanation of what specguard is and a legend\nfor the status badges, so a reader who has never seen the product understands\nwhat a row means. Specs are grouped into areas that can be collapsed and that\ncarry a count and a roll-up status, and a table-of-contents lets the reader jump\nto an area — so the catalog can be scanned by section, not read row by row.\n\n## Why\n\nA wall of identical rows is overwhelming and forces item-by-item reading. An\norientation layer — what this is, how to read it, and the shape of the whole —\nlets a newcomer grasp the report at a glance before diving in.\n","tests":["web/e2e/overview.spec.ts"],"refs":[{"file":"web/e2e/overview.spec.ts","line":39,"status":"passed"}],"covers":["web/src/components/Intro.tsx","web/src/components/Dashboard.tsx"],"covered":true,"coversOk":true,"draft":false,"parent":"ui-report","preview":"/","fingerprint":"7c9f4b61815bd8fc","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed","artifacts":[{"name":"orientation","path":"assets/specs/ui-orientation/0.png"}]},{"id":"ui-report","title":"The report is an explorable interface","path":"specs/ui/report.md","body":"## Behaviour\n\nThe report is a browsable UI: a dashboard that orients a reader and groups specs\nby area, search, a detail view with code deep-links and screenshot galleries,\nand it works hosted under a subpath. The specs below are those behaviours.\n\n## Why\n\nThe catalog is only as useful as it is explorable; the interface is what lets a\nPM or newcomer actually navigate and trust it.\n","tests":null,"covers":["web/src"],"covered":false,"coversOk":true,"draft":false,"hasChild":true,"preview":"/","fingerprint":"de20ac074b75cf56","lifecycle":"proposed"},{"id":"ui-search","title":"The catalog is searchable","path":"specs/ui/search.md","body":"## Behaviour\n\nTyping in the filter box narrows the visible specs to those whose id, title or\narea matches, and an empty result is stated plainly.\n\n## Why\n\nA catalog you can't search is a wall of text; search is what makes \"find the\nspec for X\" a second, not a scroll.\n","tests":["web/e2e/overview.spec.ts"],"refs":[{"file":"web/e2e/overview.spec.ts","line":97,"status":"passed"}],"covers":["web/src"],"covered":true,"coversOk":true,"draft":false,"parent":"ui-report","preview":"/","fingerprint":"e8c65cc433e21a2c","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed","artifacts":[{"name":"search — filtered to “login”","path":"assets/specs/ui-search/0.png"}]},{"id":"ui-spec-detail","title":"A spec detail shows its behaviour and tests","path":"specs/ui/spec-detail.md","body":"## Behaviour\n\nOpening a spec shows its rendered markdown behaviour, its covering tests, and\n(when a run was ingested) its pass/fail state and any screenshots.\n\n## Why\n\nThe detail view is where a reader confirms a behaviour is real: the words, the\ntests that hold it true, and the visual proof.\n","tests":["web/e2e/overview.spec.ts"],"refs":[{"file":"web/e2e/overview.spec.ts","line":111,"status":"passed"}],"covers":["web/src"],"covered":true,"coversOk":true,"draft":false,"parent":"ui-report","preview":"/spec/ui-dashboard","fingerprint":"fe99b001d52eadfd","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed","artifacts":[{"name":"spec detail","path":"assets/specs/ui-spec-detail/0.png"}]},{"id":"ui-subpath-assets","title":"Screenshots load when the report is hosted under a subpath","path":"specs/ui/subpath-assets.md","body":"## Behaviour\n\nThe report can be hosted at a site root or under a project subpath (e.g. GitHub\nproject Pages at `/\u003crepo\u003e/`). On any route — including a hard refresh straight to\na spec-detail deep link like `/\u003crepo\u003e/spec/\u003cid\u003e` — a spec's screenshots resolve\nagainst the app's base and load, rather than 404'ing.\n\n## Why\n\nThe screenshot galleries are the visual proof a spec is really implemented. If\nthey break the moment the report is published under a repo subpath, that proof\nis lost exactly where a reviewer looks for it.\n","tests":["web/e2e/report-subpath.spec.ts"],"refs":[{"file":"web/e2e/report-subpath.spec.ts","line":68,"status":"passed"}],"covers":["web/src/base.ts"],"covered":true,"coversOk":true,"draft":false,"parent":"ui-report","preview":"/spec/ui-subpath-assets","fingerprint":"ec22d48047f3cba7","lifecycle":"accepted","acceptedBy":"clems4ever","acceptedAt":"2026-08-01T14:42:04Z","result":"passed"}],"findings":null,"testFiles":17,"ok":true,"areas":[{"name":"diff","title":"Diff","description":"Reviewing only what a change touched: the delta of coverage against a base git ref, so a reviewer can focus on what regressed rather than the whole catalog."},{"name":"lint","title":"Lint","description":"The core traceability rules: every spec must be covered by a real test, every reference must resolve to a defined spec, and drafts are held to a softer bar."},{"name":"report","title":"Report","description":"Turning a run into a self-contained, shareable artifact: the searchable spec catalog, published per branch, with its data embedded so it works offline."},{"name":"results","title":"Results","description":"Overlaying a real test run onto the specs: mapping Go and Playwright outcomes back to the behaviours they prove, so a spec reads pass or fail."},{"name":"server","title":"Server","description":"The live mode: an HTTP API and a coverage badge that serve the report and its status while you work on the repo."},{"name":"spec","title":"Spec","description":"How a spec is written and parsed: the markdown frontmatter that declares a stable id, a human title, and the code it governs."},{"name":"ui","title":"UI","description":"The report's own interface: the dashboard, search, spec detail, code deep-links and screenshot galleries a reader explores."}],"hasResults":true};window.__SPECGUARD_META__={"repo":"clems4ever/specguard","branch":"feat/preview-env","commit":"348ef4da37e1c028af02d707ffff1c19f0b94f10","commitShort":"348ef4d","generatedAt":"2026-08-01T16:12:12Z","previewBase":"https://clems4ever.github.io/specguard/pr-14/"};</script>
