# Publish a browsable, searchable spec report for `main` to GitHub Pages, so
# anyone can explore the specs without checking out the repo or running a server.
#
# The page is the self-contained artifact from `specguard report`: the whole
# catalog with client-side search, stamped with the branch, commit and build
# time so a viewer always knows how fresh it is. Today only `main` is published;
# the report command already slugs branch names reversibly (internal/report),
# so extending this to one page per branch is a contained change later.
#
# Requires: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publishes the report to the gh-pages branch root

# Never let two Pages deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the commit can be stamped

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the single-file UI
        working-directory: web
        run: |
          npm ci
          npm run build:single

      - name: Build specguard
        run: go build -o specguard ./cmd/specguard

      - name: Run specguard's own test suite (real pass/fail on its own specs)
        run: go test -json ./... > "$RUNNER_TEMP/go-results.json" || true

      - name: Run the UI e2e (screenshots of specguard's own report → galleries)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          # The `@spec:ui-*` tests attach screenshots of specguard's own UI; the
          # JSON report carries them (inline) for the galleries.
          CI=1 npx playwright test --reporter=json > "$RUNNER_TEMP/e2e.json" || true

      - name: Generate specguard's own spec report (dogfood)
        run: |
          mkdir -p public
          # specguard reports on ITSELF: specs/ pinned to the Go tests under
          # internal/ and the UI e2e under web/e2e — each spec's real pass/fail,
          # deep links to the covering test, and screenshots of its own screens.
          ./specguard report -C . \
            -web web/dist-single/index.html \
            -branch "${{ github.ref_name }}" \
            -commit "${{ github.sha }}" \
            -repo "${{ github.repository }}" \
            -results "$RUNNER_TEMP/go-results.json,$RUNNER_TEMP/e2e.json" \
            -assets public/assets -assets-base assets \
            -o public/index.html
          # Serve the same app for any path so deep links (/spec/<id>) resolve
          # on a hard refresh — GitHub Pages returns 404.html for unknown paths.
          cp public/index.html public/404.html

      # Publish main's report to the gh-pages branch ROOT. keep_files preserves
      # the per-PR preview directories (pr-<n>/) that preview.yml publishes to the
      # same branch, so the site serves the main catalog at / and previews at
      # /pr-<n>/. (Pages Source must be set to the gh-pages branch.)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
