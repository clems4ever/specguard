# Publish a browsable, searchable spec report for `main` to GitHub Pages, so
# anyone can explore the specs without checking out the repo or running a server.
#
# The page is the self-contained artifact from `specguard report`: the whole
# catalog with client-side search, stamped with the branch, commit and build
# time so a viewer always knows how fresh it is. Today only `main` is published;
# the report command already slugs branch names reversibly (internal/report),
# so extending this to one page per branch is a contained change later.
#
# Requires: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the commit can be stamped

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the single-file UI
        working-directory: web
        run: |
          npm ci
          npm run build:single

      - name: Build specguard
        run: go build -o specguard ./cmd/specguard

      - name: Run the example test suite (for pass/fail in the report)
        run: (cd example && go test -json ./... > "$RUNNER_TEMP/go-results.json") || true

      - name: Capture demo screenshots (for per-spec galleries)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          node scripts/demo-shots.mjs "$RUNNER_TEMP/shots"

      - name: Generate the static report for main
        run: |
          mkdir -p public
          ./specguard report -C example \
            -web web/dist-single/index.html \
            -branch "${{ github.ref_name }}" \
            -commit "${{ github.sha }}" \
            -repo "${{ github.repository }}" \
            -results "$RUNNER_TEMP/go-results.json,$RUNNER_TEMP/shots/results.json" \
            -assets public/assets -assets-base assets \
            -o public/index.html
          # Serve the same app for any path so deep links (/spec/<id>) resolve
          # on a hard refresh — GitHub Pages returns 404.html for unknown paths.
          cp public/index.html public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
